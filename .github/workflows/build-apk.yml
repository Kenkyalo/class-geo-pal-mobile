name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Required for modern Android builds

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install EAS CLI
        run: npm install -g eas-cli
        
      - name: Setup Expo
        run: npx eas login --token ${{ secrets.EXPO_TOKEN }}
        
      - name: Build Android APK
        # Added --local to ensure the file is created on this runner for the upload step
        run: npx eas build -p android --profile preview --non-interactive --local --output=./app.apk
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Class-Geo-Pal-APK
          path: ./app.apk